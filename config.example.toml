# 我，deepseek（插件 ID：github.TommyAAKK.maibot-I-deepseek）
#
# 这个文件里的每一项都在 WebUI 的「插件 → 我，deepseek → 配置」页面里可视化编辑，
# 页面上显示的是中文名称与中文说明。手改本文件也可以，保存后宿主会自动热重载。
#
# 两点约定：
#   1. [plugin] 节由宿主保留：enabled 是启停开关，config_version 必须与 _manifest.json 的版本一致。
#   2. 其余六节与 cg_config_model.py 里的配置类一一对应，删掉某项就等于用代码里的默认值。

# ── 插件（宿主保留节）────────────────────────────────────────────
[plugin]
# 是否启用插件。关闭后不采集、不抽取、也不注入。
enabled = true
# 配置版本号。改配置结构时递增；必须与 _manifest.json 的 version 一致。
config_version = "1.4.0"

# ── 采集：决定观察哪些聊天、多久抽一次 ──────────────────────────
[capture]
# 是否采集聊天消息。关闭后不再从聊天流里收集消息。
enabled = true
# 是否观察群聊消息。
capture_groups = true
# 是否观察私聊消息。
capture_private = true
# 每次抽取向前回看多少小时的消息。太大拖慢后台任务。
recent_hours = 12.0
# 每次抽取最多取多少条历史消息。
recent_limit = 60
# 实际交给模型的聊天条数上限，取最新的那些。
max_messages_per_extract = 30
# 攒够这么多条新消息才触发一次抽取。
min_new_messages = 8
# 即使没攒够，最多等这么久也要抽一次（秒）。
max_wait_seconds = 900
# 同一个会话两次抽取之间至少隔这么久（秒）。
min_interval_seconds = 180
# 后台任务多久检查一次有没有到期的会话（秒）。
refresh_tick_seconds = 30
# 单次送入模型的聊天记录最多多少字符。
max_session_chars = 6000

# ── 抽取：调用哪个模型、抽取哪些类别 ────────────────────────────
[extract]
# 是否调用模型抽取。关闭后只注入已有记忆，不再抽新的。
enabled = true
# 使用的模型任务名。宿主内置 utils 一定可用；
# 若你在 model_task_config 里配了 memory 任务，改成 memory 更合适。
task_name = "utils"
# 直选具体模型名。留空则按上面的任务名路由。
model_name = ""
# 抽取温度。建议低温，0.2 左右比较稳。
temperature = 0.2
# 单次抽取的最大输出 token。设小了会把模型的思考/输出截断，宿主会判定为空回复并抛 EmptyResponseException。
# 填 0 表示不覆盖，完全沿用宿主 model_task_config 里该任务的设置。
max_tokens = 1200
# 要抽取的类别，可选 open_loop / emotion / relationship / self / creative，默认全部五类。
categories = ["open_loop", "emotion", "relationship", "self", "creative"]
# 单次抽取最多接受多少条结果。
max_items_per_extract = 12
# 每条记忆的正文最多多少字。
max_content_chars = 60
# 抽取调用的 RPC 超时（毫秒）。宿主默认只有 30 秒，而模型任务通常要 120~240 秒，
# 太小会在模型返回前就先超时。
rpc_timeout_ms = 150000
# 遇到「响应内容为空」时额外重试几次。小模型结构化抽取时偶发。
empty_response_retries = 1

# ── 注入：在回复前追加什么、追加多少 ────────────────────────────
[inject]
# 是否在回复前把情境连续性追加给模型。
enabled = true
# 注入块的开头标记，模型靠它识别边界。
header = "<companion-state>"
# 注入块的结尾标记，与起始标记成对出现。
footer = "</companion-state>"
# 注入块前的引导语，告诉模型该怎么用这些内容。
lead_in = "【情境连续性参考】以下内容来自你们过往的互动，只在自然合适时融入；不要逐条复述，也不要声称自己『记得』或『查了记录』。"
# 注入正文的总长度上限（字符）。
max_chars = 600
# 每个类别最多注入几条。
max_items_per_category = 3
# 低于这个显著度的条目不再注入。
min_salience = 0.35
# 把每次注入写进 gap_injections 表。排查时很有用，平时关掉省空间。
record_injections = false
# 群聊记忆跨流：在一个群里记住的事，在别的群和私聊里也能想起来。
cross_session = true
# 从别的会话最多补几条记忆。0 表示不补。
cross_session_limit = 3
# 跨流补进来的条目要求更高显著度，避免无关紧要的事到处冒出来。
cross_session_min_salience = 0.55
# 私聊记忆可流入群聊。默认关闭——私聊内容更私密。
# 开启后仍然由模型自己判断要不要在群里提起（注入时会标明来源并让它自己决定）。
private_to_group = false
# 注入轮换：刚说过的记忆往后排，别的话题才有机会进来。
# 关掉的话每轮都会按显著度取同样的前几条，回复容易变成模板。
rotation = true
# 连刷折价强度：连续 N 轮被注入的记忆，竞争分乘以 1/(1+权重*N)。
# 调大更积极换话题；设 0 表示不管连刷几轮，只按显著度排。
rotation_streak_weight = 0.35
# 冷却时长（小时）：上一轮刚注入过的记忆在这段时间内竞争分打对折到满折，
# 安静过这个时长就完全不打折，能重新排到前面。
rotation_cooldown_hours = 2.0
# 注入损耗：每被注入一轮，显著度乘这个系数。反复被说的事会缓慢掉分，
# 把位置让给新记忆。别调太低——注入不是遗忘，真正的遗忘由 [retention] 管。
inject_salience_decay = 0.92
# 话题相关加权：对方这一轮正在聊某件事时，跟它有关的记忆竞争分会乘上
# (1 + 这个值 * 相关度)，也就是最多乘 (1 + 这个值)。
# 只加分、不淘汰——不相关的记忆照常参与竞争，绝不会因为不相关就被踢出去。
# 设 0 表示完全不看当前话题。
relevance_weight = 0.6

# ── 保留：各类记忆的过期策略 ────────────────────────────────────
[retention]
# 还没接上的话题保留多少天。
open_loop_ttl_days = 30
# 对方当时的情绪状态保留多少小时。
emotion_ttl_hours = 72
# 相处方式、称呼习惯这类关系线索保留多少天。
relationship_ttl_days = 180
# 自己的人设与设定一致性保留多少天。
self_ttl_days = 180
# 一起玩过的梗、共创设定保留多少天。
creative_ttl_days = 180
# 单个会话最多保留多少条活跃记忆，超出后淘汰最旧、显著度最低的。
max_items_per_session = 120
# 记忆随时间衰减：闲置越久显著度越低，低于阈值就转为「遗忘」。
decay_enabled = true
# 闲置多少天显著度掉一半。设得太大等于不衰减；设为 0 关闭衰减。
decay_half_life_days = 45.0
# 显著度掉到这个值以下就标为「遗忘」。
# 遗忘不是删除：不会被主动提起，但别人明确说到时还能想起来。
forget_below = 0.12
# 兜底规则：就算显著度还很高，闲置这么久也直接标为遗忘。0 表示只按阈值判断。
forget_after_days = 180.0
# 别人明确提到某件事时，把对应的遗忘条目重新想起来。
recall_enabled = true
# 对方这句话和遗忘的记忆要多像才算「明确强调」。
# 按「记忆被覆盖了多少」算：完整提到核心内容约 0.45，只沾一个词约 0.27，完全无关 0。
# 调高更保守（很难想起来），调低更容易被无意中提到就唤醒。
recall_similarity = 0.40
# 一轮回复里最多唤醒几条遗忘的记忆，0 表示不注入。
recall_limit = 2

# ── 情绪：Bot 自身的持续心境 ────────────────────────────────────
# 情绪由八个基元（开心/愤怒/紧张/伤心/兴趣/平静/厌恶/惊讶）各自演化，
# 愉悦度与情绪强度是由它们算出来的派生量，不再单独配置。
[mood]
# 是否启用情绪模拟。关闭后不更新、不注入。
enabled = true

# · 八个情绪基元的基线：没事发生时会慢慢回到这个强度 ·
# 开心：平时有多容易开心
emotion_joy_baseline = 0.25
# 愤怒：平时有多容易生气
emotion_anger_baseline = 0.05
# 紧张：平时有多容易不安
emotion_anxiety_baseline = 0.10
# 伤心：平时有多容易低落
emotion_sadness_baseline = 0.05
# 兴趣：平时有多容易对话题感兴趣
emotion_interest_baseline = 0.45
# 平静：平时的放松程度
emotion_calm_baseline = 0.55
# 厌恶：平时有多容易嫌弃
emotion_disgust_baseline = 0.03
# 惊讶：平时有多容易被惊到
emotion_surprise_baseline = 0.10

# · 八个情绪基元的半衰期（分钟）：多久冲淡一半，0 表示永不衰减 ·
# 开心多久冲淡一半
emotion_joy_half_life_minutes = 120.0
# 生气多久消下去
emotion_anger_half_life_minutes = 30.0
# 不安多久平复一半
emotion_anxiety_half_life_minutes = 60.0
# 难过多久淡一半
emotion_sadness_half_life_minutes = 180.0
# 兴致多久退一半
emotion_interest_half_life_minutes = 240.0
# 平静多久被打破
emotion_calm_half_life_minutes = 90.0
# 嫌弃多久过去
emotion_disgust_half_life_minutes = 90.0
# 惊讶很快就过去
emotion_surprise_half_life_minutes = 8.0

# · 派生量基线（只影响「整体有多激烈」这层包装）·
# 情绪强度基线（0 到 1）：平时有多容易被激起。
# 注意：这个维度衡量「反应有多激烈」，不是「有没有力气反应」——后者是精力。
arousal_baseline = 0.35
# 情绪强度半衰期（分钟）。激动多久平复一半，0 表示永不衰减。
arousal_half_life_minutes = 45.0

# · 精力（机械量，不由模型调整）·
# 精力初值（0 到 1）：首次运行时的精力。之后由说话消耗与时间恢复决定。
energy_baseline = 0.6
# 精力每小时恢复多少。0.35 约 3 小时回满；心情好会恢复得更快。
energy_recover_per_hour = 0.35
# 离线超过多少小时，再上线时当作睡了一觉：精力拉满、情绪回到基线。0 表示不重置。
offline_reset_hours = 4.0
# 精力耗尽（掉到 0）后，要恢复到该值才重新允许主动发言。
# 这是滞回阈值：设成 0 会让 Bot 在 0 附近反复诈尸，设太高会长时间闭麦。
exhausted_exit = 0.3

# · 调节与注入 ·
# 关键词启发式的强度倍率。0 表示完全只用模型判断。
heuristic_gain = 1.0
# 模型判断与当前状态的混合权重，越大越听模型。
llm_blend_weight = 0.7
# 把情绪写进回复提示词，让心情真的影响语气。
inject = true
# 情绪块的起始标记。
header = "<companion-mood>"
# 情绪块的结束标记。
footer = "</companion-mood>"
# 情绪块的字数上限。
max_chars = 180
# 附上「该怎么表现」的行为指令。关掉的话模型基本不会真的改变语气。
include_guidance = true
# 精力低于 0.5 时是否真的调低宿主的发言频率（不只是靠提示词劝）。
# 精力高于 0.5 时不干预；被 @ 或被点名时始终会回复。
# 注意：宿主在 focus 模式下会忽略这个倍率，那时只能靠提示词与 wait 工具。
gate_enabled = true
# 精力耗尽时把发言频率压到该值。必须大于 0：
# 宿主在频率为 0 时会进入静默模式，连被 @ 都不会回。
gate_floor = 0.05
# 精力耗尽瞬间让 Bot 先说一句「先去忙别的」再安静下来，语气由模型按当前情绪自己决定。
# 留空 = 不说这句话（Bot 会直接安静下来，看起来像突然闭麦，一般不建议）。
farewell_intent = "你现在精力见底了，马上要安静一段时间。请用一句话自然地说明你要去做什么（比如去休息、去忙别的、晚点回来），语气按你当前的心情来，不要解释这是设定，也不要在这条消息里继续聊别的话题。"

# ── 人物 ────────────────────────────────────────────────────────
[people]
# 从聊天里记住「此刻和你说话的是谁」以及「你们之间是什么关系」。
enabled = true
# 机器人自己的账号或昵称，多个用英文逗号分隔（写成 ["123456", "小鱼"]）。
#
# 为什么需要：机器人自己发的消息在聊天记录里跟别人的长得一模一样，
# 抽取时模型可能把她自己当成一个陌生人记进人物表（真机上出现过
# 好感度 5.3、六维全基线的「小鱼」）。
#
# 插件一般能自动学到（拉消息时对比宿主的 filter_mai 结果做差集），
# 所以这里通常留空即可。留空也不会把她记成别人，只是自动学习需要
# 先成功跑过一次抽取。
self_identities = []
# 自动判断关系角色（主人/朋友/普通群友/陌生人）需要的最低置信度。
# 玩笑、吵架、转述这类判断会被挡在这里，不会写进人物记录。
# 调高更保守，调低更容易记住但更容易被玩笑话带偏。
auto_role_min_confidence = 0.7
# 是否允许自动判断覆盖你手动配置的角色与好感度。
# 默认关闭 = 手动优先：你标了某人是主人，群里再有人说「我才是你主人」也改不动。
manual_override = false
# 是否把人物认知注入回复提示词。
inject = true
# 按好感度注入对应的「聊天方式」（亲近 / 客气 / 保持距离）。
# 这是关系密切程度的主要体现——只影响语气，不给称呼。
inject_tone = true
# 是否把「主人」「朋友」这类角色名称直接写进提示词。
# 默认关闭：用户要求不注入称呼，避免模型开口就叫。
inject_role_label = false
# 是否只允许称呼 owner 为「主人」。
# 默认开启。原因：记忆里存着真实发生过的对话（「小鱼称呼 阿汤 为主人」
# 「坚持自己是主人群友A的小女仆」），这些是群里真实的玩笑，不该删；
# 但它们每轮都会被注入，等于每轮都在提醒模型「你有主人，叫主人」。
# 开启后，只有当轮说话人 relation_role 是 owner 时才保留「主人」二字，
# 其他人一律换成「你」。关掉则恢复旧行为（谁都可能被叫主人）。
deference_owner_only = true
# 是否注入你手写的人物标签。
# 标签只能由你自己在页面上写（「XX的XX」这种关系化说法，比如「抽象的群友」）。
# 具体的性格/经历交给宿主的画像系统，这里不重复。
# 关掉后提示词里只留关系角色、说话方式和情绪影响。
inject_notes = true
# 一次注入最多几个人。
max_people = 2
# 人物块的字数上限。人物块单独占预算，不挤占记忆块。
max_chars = 240
# 人物块的起始标记。
header = "<companion-people>"
# 人物块的结束标记。
footer = "</companion-people>"
# 人物块的引导语。
lead_in = "（关于此刻和你说话的人，你记得这些）"
# 记录每个人给 Bot 带来的情绪波动，用于形成喜欢/厌恶的排序依据。
track_impact = true
# 情绪影响的衰减系数：每次更新时旧值乘这个数。
# 越小越看重近期互动（人会变）；1.0 表示永不衰减。
impact_decay = 0.95
# 管理页与 mcompgap 命令列出的人物数量上限。
list_limit = 50

# ── 关系六维（第 34 轮）─────────────────────────────────────────────
#
# 关系不再是一个「好感度」数字，而是六个互相独立的维度：信任、亲近、
# 尊重、张力、熟悉、他待我。互相独立是关键——真实关系里它们**可以矛盾**：
# 可以很亲近但不敢托付，可以很尊重但一点不想走近。
# 好感度仍然存在，但它现在是这六维算出来的摘要，不再是真相。
#
# 把六个维度的**矛盾组合**说成一句话注入提示词，而不是报数字。
# 例如「你们混得很熟，但有些话你还是不跟他说。」——这种话单值好感度
# 永远说不出来，这就是「活人感」的差别。
inject_axes = true
# A 夸 B 或说 B 坏话时，会影响你对 B 的信任与亲近。
# 只动信任和亲近，不动尊重——服不服一个人得自己看，不能听说的。
social_influence = true
# 别人说一句能推动多少。0 等于关掉。
social_weight = 0.25
# 传话终究只是传话：无论别人怎么说，最多只能推动这么多。
# 防止靠别人嘴把一个人捧成知己或踩成仇人。
social_cap = 0.20
# 多久不联系，六维往中性值回落一半。
# 熟悉度不受影响——聊过的次数不会因为一段时间没说话就归零。
axis_half_life_days = 90.0

# 关系身份表。每一项三个字段：
#   key   —— 标识，英文小写，写进数据库用（owner / teacher / …）
#   label —— 显示给你看的中文名（主人 / 老师 / …）
#   tone  —— 该怎么对待他。**写行为要求，不要写称呼**
#            （「你愿意顺着他、也更在意他的看法。」而不是「他是你的主人」）
# 可以随便增删。必须保留一个 key = "stranger"，它是「什么都没判断出来」时的兜底。
# 提示词只有在 inject_role_label 打开时才会把 label 写进去；tone 一直生效。
#
# 注意：TOML 的 [[people.roles]] 一旦开始，后面的键就都归这个表了，
# 所以两张表必须放在 [people] 普通键的最后面。
[[people.roles]]
key = "owner"
label = "主人"
tone = "你愿意顺着他、也更在意他的看法。"

[[people.roles]]
key = "friend"
label = "朋友"
tone = "你们处得来，可以更放松一些。"

[[people.roles]]
key = "member"
label = "普通群友"
tone = ""

[[people.roles]]
key = "stranger"
label = "陌生人"
tone = ""

# 好感度分级表。min_affection 是**下限**：好感度大于等于它的第一档就是它。
# 程序会按这个值从大到小自动排序，所以这里填的顺序不影响结果。
# tone 是这一档的聊天方式（只影响语气，不是称呼）。
[[people.intimacy_levels]]
key = "close"
label = "知己"
min_affection = 80.0
tone = "你们很熟，说话可以随意些、能开玩笑，也愿意主动说说自己的事。"

[[people.intimacy_levels]]
key = "friend"
label = "朋友"
min_affection = 50.0
tone = "你们算朋友，语气轻松，可以适当调侃，但不用刻意热络。"

[[people.intimacy_levels]]
key = "acquaintance"
label = "普通群友"
min_affection = 20.0
tone = "你们只是同一个群里的熟人，礼貌但保持距离，别主动倒私事。"

[[people.intimacy_levels]]
key = "stranger"
label = "陌生人"
min_affection = -100.0
tone = "你们还不熟，语气客气克制，别表现得太亲近，也别打听对方私事。"

# ── 喜好与厌恶 ──────────────────────────────────────────────────
# Bot 自己的口味。和「人物」那节相反：人物是「对别人」的，这里是
# 「关于她自己」的。
#
# 怎么来的：人设是种子，聊天是养料。第一次启动时让模型读一遍宿主的
# [personality] 人设，提炼出「她会喜欢什么、讨厌什么」作为起点；之后
# 每次抽取顺手判断聊天里有没有强化或削弱某个口味。
[prefs]
# 启用后才会抽取和注入。关掉后已有的口味保留但不生效。
enabled = true
# 首次启动时从宿主人设里提炼初始口味。只在库里一条都没有时跑一次。
persona_seed = true
# 去宿主 global_config 里按这个点号路径找人设文本。
# 宿主把人格描述放在 [personality] personality 这一项。
persona_key = "personality.personality"
# 旧强度的权重。越大口味越稳定（不容易被一次聊天带偏），越小越随性。
merge_decay = 0.85
# 最多保留多少条口味。超出后按强度从低到高淘汰。
max_prefs = 20
# 把口味注入提示词。关掉后只记录不告诉模型。
inject = true
# 一轮最多带几条。太多会喧宾夺主，把注意力从当前话题上抢走。
max_items = 6
# 低于这个强度的口味不注入。调低会把「只是有点在意」的东西也带上。
min_strength = 0.35
# 喜好块单独占的字数预算，不挤占记忆块。
max_chars = 200
# 块标记，用来和记忆块、人物块区分开。
header = "<companion-prefs>"
footer = "</companion-prefs>"
# 块前面那句提示。强调「这是她自己的想法」，避免模型读成别人给她的设定。
lead_in = "（这些是你自己的口味，不是别人告诉你的）"
# 管理页和 mcompgap 命令一次最多显示多少条。
list_limit = 50

# ── 缺席感：被冷落之后再见到你，反应应该不一样 ──────────────────
# 数据来自每个会话「上一次有人说话的时间」，反应档位由「隔了多久」和
# 「关系多近」共同决定——陌生人没理由在意你多久没来。
[absence]
# 是否感知「多久没说话了」，并影响回复。
enabled = true
# 把缺席提示注入给模型。
inject = true
# 多久没说话才算「有缺席感」。低于这个时长不提——每小时提一次是骚扰。
min_hours = 6.0
# 超过这个小时数就按「很久」处理，不再线性细分。
long_hours = 72.0
# 群聊是否也提示缺席。默认关：群冷清是群的事，不是「你冷落我」。
# 开启后只在长期冷清时轻描淡写提一句，而且措辞是「这个群」，不提具体的人。
group_enabled = false
# 缺席提示的字数上限。这段本身很短，一般不用改。
max_chars = 60
# 独立成段的标记，不占记忆块预算。
inject_header = "<companion-absence>"
inject_footer = "</companion-absence>"

# ── 边界感：她可以不愿意接话 ────────────────────────────────────
# 这里是两个独立机制，别混为一谈：
#   1. 状态提示（note_*）：只把「此刻心情 / 跟他的关系 / 讨厌什么」告诉模型，
#      由它自己判断这句话算不算冒犯、要不要回。默认开，轻。
#   2. 临场沉默（silence_*）：插件判定「该沉默」，再让模型选「完全不发」还是
#      「冷淡应一声」。要求心情、关系、话题三点同时成立，外加频率上限。默认关。
[boundary]
# 启用边界感（总开关）。
enabled = true
# 把状态告诉模型。
note_enabled = true
# 状态提示是否也进 planner（影响「要不要回」这个决策）。
# 默认关：只影响回复语气。开启后每轮多几十个 token，也会改变发言判断。
note_to_planner = false
# 允许真的沉默。默认关，建议先只开上面的状态提示观察一段时间。
silence_enabled = false
# 沉默方式：choose = 交给模型在「完全不发」和「冷淡应一声」之间自己挑；
# taciturn = 不允许完全不发，只能冷淡回一句。
silence_level = "choose"
# 以下三个门槛必须**同时**满足才允许沉默。
# 心情门槛·愉悦度：要低到这个值以下。
silence_min_valence = -0.35
# 心情门槛·愤怒：要高于这个值。和愉悦度门槛同时满足才算「真的在气头上」。
silence_min_anger = 0.45
# 关系门槛·张力：相处绷到这个程度才可能不想理他。
# 陌生人张力天然低（基线 0.15），靠这条避免误伤。
silence_min_tension = 0.55
# 话题门槛·厌恶强度：对方踩中的正是她讨厌的东西，且强度够。
silence_min_dislike = 0.55
# 频率上限：时间窗内最多沉默几次。没有上限这个功能会退化成「经常不理人」。
silence_max_per_window = 2
# 频率上限的时间窗（小时）。默认 3 小时内最多 2 次。
silence_window_hours = 3.0

# ── 在场感知 ────────────────────────────────────────────────────
# 原来的缺席感只算「现在 - 她上次说话」，**假设她一直醒着**。真机上这就翻车：
# 你每天 00:00 关机、11:00 开机，某天上午开机后她看到「73 小时没说话」，
# 第一句是「你怎么这么久没来」——可其中 33.8 小时是她自己不在。
#
# 这里从宿主的 online_time 表读出她真正在线的时间，把间隔拆成两段：
#   她不在的部分   → 「我这几天没开机」（不该怪对方）
#   她醒着但对方没来 → 这才该有缺席感
#
# 读不到在线数据时**退回旧算法**（一律按「对方没来」处理），
# 不会因为读失败就把每一段都判成「我不在」。
[presence]
# 启用在场感知。
enabled = true
# 往回读多少天的在线时段。宿主每 5 分钟写一行，30 天约 8600 行。
online_days = 30.0
# 离线占比超过这个值，就不判「被冷落」而是判「我不在」。
offline_dominant = 0.5
# 是否注入「那段时间我不在」的提示。关掉则只修正判断、不额外说话。
away_enabled = true

# ── 历史补抓 ────────────────────────────────────────────────────
# 宿主只在收到消息时写库，所以关机期间的消息**永久缺失**（实测：
# online_time 的 8 段离线区间内 mai_messages 计数全为 0）。而 QQ 客户端
# 本地缓存里有——实测能往前翻 9~10 天。
#
# 只有群聊。私聊 get_friend_msg_history 返回空数组是
# 「这几天没有私聊」，**不是能力不可用**——空数组不等于失败。
#
# 需要 manifest 里声明 api.call 能力。
[backfill]
# 启用历史补抓。
enabled = true
# 同一会话两次补抓的最小间隔（分钟）。
# 补的是「关机期间的洞」，不会天天有新洞，不需要每次抽取都补。
min_interval_minutes = 30
# 最多往回补多少天。适配器本地缓存上限约 9~10 天，设更大只会翻到空页。
max_age_days = 10.0
# 最多翻多少页。每页 100 条，40 页 ≈ 4000 条，远超 10 天实际量。
max_pages = 40
# 单次补抓最多保留多少条。补抓结果要和宿主库合并后一起抽取，太多会撑爆提示词。
max_messages = 200

# ── 自主发言 ────────────────────────────────────────────────────
# 宿主的发言频率只管**触发**（攒够几条才让 Planner 跑），管不了
# 「跑起来之后要不要说」。而 focus_mode = true 时频率被硬编码成 1.0、
# 阈值恒为 1 条、空闲退避也失效——三重叠加的结果是「看到啥都要回」。
#
# 这里的做法是在 maisaka.planner.before_request 里**从工具清单里删掉 reply**
# （和 send_emoji）。模型不是「被劝别说」，是**没有说的手段**。
#
# **默认关**：它改变的是「她会说话吗」这件事，建议先开着 log_decisions
# 观察几天日志再决定。
[initiative]
# 启用自主发言闸门。
enabled = false
# 被 @ 时一定回复，不看分数。对应宿主的 inevitable_at_reply。
# 被叫名字还不应声，那不是性格，是坏了。
at_always_reply = true
# 被提到名字时也一定回复。对应宿主的 mentioned_bot_reply。
# 默认关——群里提名字太常见了。
mentioned_always_reply = false
# 开口门槛。兴趣 0.40 + 好感度 0.30 + 心情 0.20 加权之后要过这条线。
# 0.45 大致是「三样里至少两样还行」。
#
# 精力刻意不在权重里：它已经有自己的两道闸（精力耗尽的硬过滤、宿主频率门控），
# 软评分再算一遍是同一个原因算两遍。闸门管「能不能说」，软分管「想不想说」。
# 兴趣也只有命中时才参与归一化——没聊到她喜欢的东西是中性，不是负面。
threshold = 0.45
# 拦掉时是否连同发表情包的权限一起收回。
# 表情包也是发言。她要是「不想说话」却回了个表情，那就不叫不想说话。
gate_send_emoji = true
# 把每次判定结果写进日志。强烈建议开着——主动功能最难排查的就是
# 「它为什么不说话」，日志里要能直接看到原因和各项分数。
log_decisions = true
# 判「这轮不说」之后的静音窗口（秒）。设 0 关闭。
#
# 为什么需要它：focus 模式下判了「不在这说」，模型可以改用 switch_chat
# 切到别的会话，而切过去会开**新的一轮**、闸门在干净上下文里重新判一遍——
# 于是一句「不在这说」就变成了「去别处说」。静音窗是进程级的，不按会话记，
# 换到哪个会话都算。@ 仍然穿透这个窗口。
mute_seconds = 30.0
# 静音窗内是否连 switch_chat 一起收回。默认关。
# 拿掉 reply 就够拦住「说出来」了；把 switch_chat 也拿走，她就连「去看看
# 别的群」都做不到，focus 模式等于废掉。
gate_switch_chat = false

# ── 未读历史 ────────────────────────────────────────────────────
#
# 用户第 41 轮的原话：「正常人虽然会翻看历史消息，但仅限于几十条的程度，
# 对于 99+ 这种，一般不会从头看完。而 bot 现在抓取会直接全都看完，就失去了
# 离线的感觉，反而会产生一种『我一直看着，但我不说话』的监控感。」
#
# 抽取窗口一直只有最后 max_messages_per_extract 条，所以「全都看完」从来不是
# 真的。真问题在补抓那条路上：补回来的 200 条里前 170 条被直接丢掉，于是她
# 用完最后 30 条之后，像从头到尾都在场一样说话——既不是监控感，也不是如实
# 缺席，而是最糟的第三种：假装没缺过席。
#
# 这里把丢掉的部分记成「洞」（**只有条数和时间范围，不含内容**）和原文。
# 只给条数是刻意的：一旦给了内容，她就从「那会儿我不在」变成「其实我都看过」。
[history]
# 是否记录「她没看见的那几段」。
enabled = true
# 是否把「你不在的时候这儿有 N 条」注入提示词。
# 关掉则只记录不提醒。
inject_unread = true
# 未读提示的字符上限。只报条数和时间段，不需要很长。
unread_max_chars = 180
# 对方说「昨天那个」「上次说的」时，是否去翻聊天记录。
# 翻不到就如实说没翻到，而不是顺着上下文编。
lookup_enabled = true
# 一次最多翻出几条记录。再多就不是「翻翻看」，是「通读」了。
lookup_limit = 3
# 翻记录时的相似度门槛。消息比记忆长得多，所以比记忆那边的 0.40 低一点。
lookup_similarity = 0.34
# 每个会话最多保留多少条原文。只用于翻记录，不参与记忆衰减。
history_keep = 1200
# 每个会话最多保留几段洞。太久以前的洞没有提的价值。
max_holes = 40

# ── 念头 ────────────────────────────────────────────────────────
#
# 用户的原话：「不是单纯的、代码和规则上的拒绝，而是在一个她完全可以继续
# 有用、继续正确、继续被喜欢的时刻，说一句让场面冷下来的话——而且说完
# 不补救。」
#
# 三处刻意的设计：
#   1. 念头不是事实。它只存在 gap_thoughts 里，**不进记忆库**、不参与记忆
#      注入，而且每条必须带一句真实的聊天原文当来源。否则会形成
#      「猜他不开心 → 想关心 → 把关心当证据 → 判定他确实不开心」的循环。
#   2. 默认开，但频率很保守（6 小时 1 次、每天 2 次）。第一次上线宁可
#      太少见——太少见只是没注意到，太常见就变成人设崩了。
#   3. 当场信号是另一条来源：同一件事问到第三遍、对方连着敷衍、近几轮全是
#      问句。这些不需要建表，一条规则就能算出来，而且「说不出理由地不想接」
#      常常根本没有长期来源。
[thought]
# 是否启用念头。关掉则完全回到原来的相处方式。
enabled = true
# 两次「不顺着」之间至少间隔多少小时。
frequency_hours = 6.0
# 一天最多「不顺着」几次。和上面的间隔一起做双重限速。
daily_limit = 2
# 当前话题碰到念头的来源时，是否重新想起它。
# 关掉则念头只会随时间消散。
echo_enabled = true
# 是否允许她说一句不顺着对方的话。
# 关掉后念头只会影响语气和联想，不会真的说出冷场的话。
dissent_enabled = true
# 是否使用当场信号（问烦了 / 被敷衍 / 被当问答机）。
instant_signals = true
# 生成完发现没冷下来时，是否要求重生成一次。
# 人设里写着「喜欢用颜文字」「语气轻快」，模型经常一句话就柔回去了。
retry_enabled = true
# 最多重生成几次。宿主侧上限是 3，这里默认只给 1 次。
retry_max = 1
# 「冷下来」的回复字数上限。超过这个长度几乎肯定在解释或找补。
dissent_max_chars = 40

# ── 留念 ────────────────────────────────────────────────────────────
#
# 「留一样完全没用的东西；对一个人好，而不是对一个任务好；在没有任何产出
# 的一天里，也不觉得自己欠了谁。」
#
# 这一节刻意小，因为它能调的只有「收不收」和「最多几件」。**没有「几条以上
# 自动清理」这种选项**：一旦自动淘汰存在，「留一样没用的东西」就会退化成
# 一个有限格子的收藏夹。满了之后系统只把状态标出来，放掉哪一条由她自己决定。
[keepsake]
# 是否允许她留一些没用的东西。
enabled = true
# 最多留几件。满了**不自动清理**，只会提醒她「可以挑一件放掉」。
max_items = 12
# 抽取时顺便问一句「有没有什么没用的东西想留着」。
# 关掉后只能靠用户在 WebUI 里手动加。
extract_hint = true
# 聊天里是否允许她提到留着的东西。默认关——一旦提起来，它就开始变得「有用」。
mention_in_reply = false
# ── 主动 ────────────────────────────────────────────────────────────
#
# 「在没有任何预设目标或指令的情况下，仅仅因为『好奇』或『觉得有趣』，
# 就去主动做一件完全没有人告诉过她或让她去做的事情。」
#
# **默认关。** 这是第一版原型，它改的是「她会不会主动找你」——最不该默认开的
# 那一类开关。宿主侧走 maisaka.proactive.trigger，那条路径会绕过频率门控直接
# 进 Planner，等于绕过了现有所有「别太吵」的机制。
#
# 还有一条硬限制：**她不能上网。** 宿主没有 web.search / web.fetch，所以
# 「好奇→自己去查」现在只能是编的。这个原型让她回读自己的过去——几百条聊天
# 原文、没聊完的话题、留着没用的东西。这是真好奇。
[proactive]
# 是否允许她自己主动开口。
enabled = false
# 两次主动之间至少隔多久（小时）。
cooldown_hours = 8.0
# 一天最多主动几次。第一版建议就是 1 次。
daily_limit = 1
# 安静多久才算「清静下来了」（分钟）。太短会把正常对话中间的停顿当成空闲。
idle_minutes = 90.0
# 免打扰时段（小时）。跨零点也支持，比如 23 到 7；两个值相同表示没有免打扰。
quiet_start_hour = 0
quiet_end_hour = 8
# 主动时是否可以把「留着的没用东西」当成由头。这是「浪费」唯一的出口。
include_keepsake = true
# 主动时是否可以把「没聊完的话题」当成由头。最接近人「忽然想起来」的感觉。
include_unfinished = true
# 没开口时是否也记一行日志。主动功能最难排查的不是「她为什么说了」，
# 而是「她为什么又没说话」。建议一直开着。
log_skips = true

# ── 调试 ────────────────────────────────────────────────────────
[debug]
# 日志级别，可选 debug / info / warning。
# 这是全局阈值：后台抽取循环（记忆衰减等）也按它过滤，不只是插件入口。
log_level = "info"
# 把最终注入文本写进日志。会把聊天内容写进去，默认关闭。
log_injection_text = false
# 把模型原始返回写进日志。排查抽取问题时打开。
log_extract_raw = false
